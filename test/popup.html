<!doctype html>
<html><head><meta charset="utf-8"><title>Scholar Assistant popup harness</title></head>
<body>
<!-- Loads the real ../popup.html markup and scripts with the chrome.* stand-in. -->
<script src="chrome-stub.js"></script>
<script>
  (async () => {
    const html = await (await fetch('../popup.html')).text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = '../src/popup.css';
    document.head.appendChild(css);
    doc.querySelectorAll('script').forEach((s) => s.remove());
    doc.querySelectorAll('img').forEach((img) => img.setAttribute('src', `../${img.getAttribute('src')}`));
    document.body.innerHTML = doc.body.innerHTML;
    for (const src of ['../src/i18n.js', '../src/settings.js', '../src/popup.js']) {
      await new Promise((resolve) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        document.body.appendChild(s);
      });
    }
  })();
</script>
</body></html>
